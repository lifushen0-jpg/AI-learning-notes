rif">展平</text><text x="1620.0" y="713.4" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">Size[B,1200,85]</text><line x1="1365" y1="695" x2="1475" y2="695" stroke="#25324a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1100" y="774.6" text-anchor="start" fill="#25324a" font-size="16" font-family="Arial, Microsoft YaHei, sans-serif">首个 Anchor = (116,90) px；stride=32</text><rect x="120" y="890" width="270" height="90" rx="11" fill="#e7f1ff" stroke="#25324a" stroke-width="2"/><text x="255.0" y="929.1" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">P3 grid</text><text x="255.0" y="953.4" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">Size[1,3,80,80,2]</text><rect x="460" y="890" width="330" height="90" rx="11" fill="#e7f1ff" stroke="#25324a" stroke-width="2"/><text x="625.0" y="929.1" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">P3 anchor_grid</text><text x="625.0" y="953.4" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">Size[1,3,80,80,2]</text><rect x="900" y="870" width="400" height="125" rx="11" fill="#e7f7ed" stroke="#25324a" stroke-width="2"/><text x="1100.0" y="926.6" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">解码 xywh，保留 obj / cls</text><text x="1100.0" y="950.9" text-anchor="middle" fill="#25324a" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">Size[B,3,80,80,85]</text><line x1="390" y1="890" x2="900" y2="870" stroke="#25324a" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="790" y1="935" x2="900" y2="960" stroke="#25324a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1430" y="870" width="320" height="125" rx="11" fill="#f0eaff" stroke="#25324a" stroke-width="2"/><text x="1590.0" y="926.6" text-anchor="middle"